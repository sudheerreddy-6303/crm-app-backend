<style>
/* Layout: one continuous paper sheet that mirrors the printed brief section by section; brown running header stays on top */
:root{
  --terra:#c4673f; --sage:#6f917a; --blue:#5e8ca0; --mustard:#d4a24c; --plum:#8c4b63; --brown:#8a5a3b;
  --ink:#2b2420; --muted:#7d6f63; --label:#9a8b7c;
  --line:#cdbba6; --soft-line:#eadbc8; --cream:#fbf6ef; --paper:#ffffff; --field:#fffdfa; --surround:#efe8de;
  --yes:#5a9e74; --maybe:#e0aa3e; --no:#d9745f;
  --serif:"Tinos","Times New Roman",Times,serif;
  --sans:"Arimo",Helvetica,Arial,sans-serif;
  --script:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--surround);color:var(--ink);font:13px/1.45 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brown)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brown);color:#fff}
.topbar-in{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:9px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar b{font-size:11px;letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.outer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.sheet{max-width:900px;margin:0 auto;background:var(--paper);box-shadow:0 2px 18px rgba(90,60,30,.12);border-radius:4px;padding:clamp(18px,5vw,48px) clamp(14px,5vw,48px) 28px;display:flex;flex-direction:column;gap:14px}
@media (max-width:520px){.outer{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:10px 24px}}

/* cover */
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{color:var(--terra);font-weight:700;font-size:11px;letter-spacing:.22em}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:10px 0 0;color:var(--ink)}
h1 em{display:block;color:var(--brown);font-style:italic}
.cover-top .dots i{width:14px;height:14px}
.lede{color:var(--muted);margin:2px 0 0;max-width:62ch;font-size:13.5px}
.hero{width:100%;max-width:100%;border-radius:16px;display:block;aspect-ratio:524/347;object-fit:cover}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tip{display:flex;gap:10px;align-items:center;background:var(--cream);border:1px solid var(--soft-line);border-radius:10px;padding:12px}
.tip b{display:block;font-size:13px}
.tip small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
.journey-h{font-weight:700;font-size:11px;letter-spacing:.06em;margin-top:4px}
.journey{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.journey::before{content:"";position:absolute;left:5%;right:5%;top:19px;border-top:2px dotted var(--line)}
.journey a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:700;font-size:11px;text-align:center}
.journey a .ic{width:38px;height:38px}
.journey a sup{position:absolute;top:-4px;left:calc(50% + 10px);width:16px;height:16px;border-radius:50%;background:#fff;border:1.3px solid var(--line);font-size:9px;display:grid;place-items:center;line-height:1;color:var(--ink)}
.journey a.done .ic{box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--terra)}
.journey a:focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:6px}

/* icon circle */
.ic{width:34px;height:34px;border-radius:50%;background:var(--c,var(--terra));color:#fff;display:grid;place-items:center;flex:none}
.ic svg{width:52%;height:52%}

/* section header */
.sec{display:flex;align-items:center;gap:12px;background:var(--cream);border:1px solid var(--soft-line);border-radius:999px;padding:6px 6px 6px 7px;margin-top:14px;scroll-margin-top:60px}
.sec .num{width:32px;height:32px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.sec h2{font-family:var(--serif);font-weight:700;font-size:clamp(19px,3.4vw,25px);margin:0;flex:1;min-width:0;line-height:1.1;text-wrap:balance}
.sec .hint{font-style:italic;color:var(--label);font-size:11px}
@media (max-width:620px){.sec .hint{display:none}}

/* question label */
.q{font-weight:700;font-size:12.5px;margin:4px 0 -6px}

/* text fields */
.row{display:grid;gap:10px}
.fld{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;background:var(--field);padding:5px 8px 4px;min-width:0;cursor:text}
.fld span{font-size:9px;letter-spacing:.05em;color:var(--label);text-transform:uppercase;line-height:1.2}
.fld input{border:0;background:transparent;font:14px var(--sans);color:var(--ink);padding:5px 0 3px;outline:none;width:100%;min-width:0;color-scheme:light}
.fld:focus-within{border-color:var(--terra);box-shadow:0 0 0 2px rgba(196,103,63,.15)}
.fld.sign{min-height:66px}
.fld.sign input{font:26px var(--script);padding-top:8px}

/* option cards */
.cards{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:9px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;border:1px solid var(--line);border-radius:9px;background:#fff;padding:16px 8px 12px;min-height:84px;cursor:pointer;font-weight:700;font-size:11.5px;line-height:1.25;transition:border-color .15s,background .15s;min-width:0}
.opt input,.pill input,.pic input,.tc input,.confirm input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.cb{position:absolute;top:7px;right:8px;width:11px;height:11px;border:1.4px solid var(--brown);border-radius:3px;background:#fff;display:grid;place-items:center}
.cb svg{width:9px;height:9px;opacity:0}
input:checked~.cb{background:var(--brown);border-color:var(--brown)}
input:checked~.cb svg{opacity:1}
.opt:has(input:checked){border-color:var(--terra);background:#fdf5ef;box-shadow:inset 0 0 0 1px var(--terra)}
.opt:has(input:focus-visible),.pill:has(input:focus-visible),.pic:has(input:focus-visible),.tc:has(input:focus-visible),.confirm:has(input:focus-visible){outline:2px solid var(--terra);outline-offset:2px}
.opt.tall{min-height:96px}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;background:#fff;cursor:pointer;font-size:12px}
.pill .cb{position:static}
.pill:has(input[type=checkbox]:checked){border-color:var(--terra);background:#fdf5ef}
.pill .inl{border:0;border-bottom:1px solid var(--line);background:transparent;font:12px var(--sans);width:150px;max-width:44vw;padding:1px 2px;outline:none;color:var(--ink)}
.pill .inl:focus{border-bottom-color:var(--terra)}

/* style pictures */
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pic{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:#fff;min-width:0}
.pic img{display:block;width:100%;aspect-ratio:167/78.6;max-width:100%;object-fit:cover}
.pic .cap{display:flex;align-items:center;gap:7px;padding:5px 9px;font-weight:700;font-size:11.5px;border-top:1px solid var(--soft-line)}
.pic .cb{position:static}
.pic:has(input:checked){border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}
.pic:has(input:checked) .cap{background:#fdf5ef}

/* colour mood */
.sw{display:flex;gap:5px;justify-content:center}
.sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.1);display:block}
.opt.mood{min-height:64px;padding:14px 8px 9px}

/* finish & flooring swatches */
.tile{width:74%;max-width:84px;height:34px;border-radius:5px;flex:none}
.matte{background:#bfa892}
.gloss{background:linear-gradient(135deg,#2f4253 0 38%,#9fb4c4 44%,#43596b 50%,#2f4253 62%,#93a9ba 70%,#2f4253 76%)}
.grain{background:repeating-linear-gradient(0deg,#b98758 0 3px,#a8764a 3px 5px,#c49464 5px 8px)}
.veneer{background:repeating-linear-gradient(90deg,#dcb980 0 4px,#c9a265 4px 5px,#e3c38c 5px 9px,#cfa96d 9px 10px)}
.acrylic{background:linear-gradient(90deg,#c4673f 0 50%,#d98762 50% 70%,#c4673f 70%)}
.duco{background:radial-gradient(ellipse 30% 40% at 70% 70%,#a7c0ad,transparent 70%),#6f917a}
.vitri{background:linear-gradient(#cfc8bd,#cfc8bd) 50% 0/1px 100% no-repeat,linear-gradient(#cfc8bd,#cfc8bd) 0 50%/100% 1px no-repeat,#ece8e1;border:1px solid #d6cfc4}
.marble{background:linear-gradient(115deg,transparent 46%,#b9b4ac 47%,transparent 49%),linear-gradient(60deg,transparent 60%,#c8c3bb 61%,transparent 63%),linear-gradient(150deg,transparent 30%,#cfcac2 31%,transparent 32.5%),#f6f4f0;border:1px solid #ddd8cf}
.wood{background:linear-gradient(90deg,transparent 49%,#7a4e30 49% 51%,transparent 51%) 0 0/50% 50%,linear-gradient(90deg,transparent 24%,#7a4e30 24% 26%,transparent 26%,transparent 74%,#7a4e30 74% 76%,transparent 76%) 0 100%/100% 50% no-repeat,linear-gradient(#7a4e30,#7a4e30) 0 50%/100% 1px no-repeat,#a3683f}

/* coins & gems */
.coins{height:38px;display:flex;align-items:flex-end;justify-content:center}
.gems{display:flex;gap:3px;color:var(--blue);height:24px;align-items:center}
.gems svg{width:20px;height:20px}

/* photos & lined notes */
.inspo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:14px;align-items:start}
.polaroid{position:relative;background:#fff;border:1px solid #e4dccf;box-shadow:0 2px 6px rgba(80,55,30,.15);padding:10px 10px 6px;cursor:pointer;display:block;min-width:0}
.polaroid:nth-child(1){transform:rotate(-1.6deg)}
.polaroid:nth-child(2){transform:rotate(.8deg)}
.polaroid:nth-child(3){transform:rotate(-.6deg)}
.polaroid::before{content:"";position:absolute;top:-7px;left:50%;width:42%;height:13px;transform:translateX(-50%) rotate(1deg);background:rgba(232,196,98,.75)}
.polaroid .area{position:relative;aspect-ratio:4/3;max-width:100%;border:1.2px dashed #b9a893;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--label);font-size:10.5px;overflow:hidden}
.polaroid .area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.polaroid input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.polaroid figcaption{font-style:italic;color:var(--muted);text-align:center;font-size:12px;padding-top:5px;font-family:var(--serif)}
.polaroid:focus-within{outline:2px solid var(--terra);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.lined{border:1px solid var(--line);border-radius:9px;background:var(--field);padding:10px 12px 8px;min-width:0}
.lined .lh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px}
.lined .lh .ic{width:20px;height:20px}
.lined textarea{display:block;width:100%;border:0;outline:none;resize:vertical;font:13.5px/26px var(--sans);color:var(--ink);padding:0 4px;margin-top:4px;
  background:linear-gradient(transparent 25px,#d9c6ad 25px 26px) 0 0/100% 26px local;min-height:calc(26px * var(--r,3) + 2px)}
.lined:focus-within{border-color:var(--terra)}
@media (max-width:720px){.inspo{grid-template-columns:repeat(3,minmax(0,1fr))}.inspo .stack{grid-column:1/-1}}

/* room tables */
.tipbox{background:var(--cream);border:1px solid var(--soft-line);border-radius:9px;padding:10px 14px;font-size:12px;color:#4a3f37}
.room{border:1px solid var(--soft-line);border-radius:9px;overflow:hidden}
.rhead,.ritem{display:grid;grid-template-columns:minmax(0,1fr) 50px 64px 44px minmax(0,1fr);align-items:center;column-gap:6px}
.rhead{background:var(--c);color:#fff;padding:6px 12px 6px 8px;font-weight:700;font-size:11px;min-height:38px}
.rhead .t{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase}
.rhead .t .ic{background:#fff;color:var(--c);width:24px;height:24px}
.rhead .h{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px}
.rhead .h::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d)}
.rhead .n{font-size:10.5px;padding-left:4px}
.ritem{padding:3px 12px 3px 14px;font-size:12px;min-height:30px}
.ritem:nth-child(even){background:var(--cream)}
.tc{position:relative;display:grid;place-items:center;height:26px;cursor:pointer}
.tc .box{width:12px;height:12px;border:1.5px solid var(--k);border-radius:3.5px;display:grid;place-items:center;background:#fff}
.tc .box svg{width:10px;height:10px;opacity:0}
.tc input:checked+.box{background:var(--k)}
.tc input:checked+.box svg{opacity:1}
.ritem .note{border:0;border-bottom:1px solid #d9c6ad;background:transparent;font:12.5px var(--sans);color:var(--ink);padding:3px 2px;outline:none;width:100%;min-width:0}
.ritem .note:focus{border-bottom-color:var(--terra)}
@media (max-width:620px){
  .rhead{grid-template-columns:minmax(0,1fr) 40px 52px 36px}
  .rhead .n{display:none}
  .ritem{grid-template-columns:minmax(0,1fr) 40px 52px 36px;padding-block:6px}
  .ritem .note{grid-column:1/-1;margin-top:2px}
}

/* confirm & thanks */
.confirm{position:relative;display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--soft-line);border-radius:9px;padding:9px 12px;cursor:pointer;font-style:italic;font-size:12px}
.confirm .ic{width:24px;height:24px;background:#fff;border:1.5px solid var(--sage);color:var(--sage)}
.confirm .ic svg{opacity:0}
.confirm:has(input:checked) .ic{background:var(--sage);color:#fff}
.confirm:has(input:checked) .ic svg{opacity:1}
.thanks{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--brown);border-radius:18px;padding:16px;color:#fff;margin-top:12px}
.thanks img{width:100%;max-width:100%;border-radius:12px;display:block}
.thanks h3{font-family:var(--serif);font-style:italic;font-size:clamp(28px,5vw,40px);margin:0 0 8px}
.thanks p{margin:0;font-size:13px;max-width:30ch;line-height:1.5}
@media (max-width:560px){.thanks{grid-template-columns:1fr;text-align:center}.thanks p{margin:0 auto}}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button.btn{font:700 13px var(--sans);border-radius:8px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.btn.pri{background:var(--terra);border-color:var(--terra);color:#fff}
button.btn:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.status{font-size:12px;color:var(--muted);align-self:center}
#summary{width:100%;min-height:300px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--field);color:var(--ink)}
.foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;margin-top:16px;font-size:10.5px;color:var(--muted)}

/* responsive grids */
@media (max-width:720px){
  .cards{grid-template-columns:repeat(min(var(--n),3),minmax(0,1fr))}
  .tips{grid-template-columns:1fr}
  .journey{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}
  .journey::before{display:none}
  .row{grid-template-columns:1fr 1fr!important}
  .row>.full{grid-column:1/-1}
}
@media (max-width:460px){
  .cards{grid-template-columns:repeat(min(var(--n),2),minmax(0,1fr))}
  .pics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:1fr!important}
  .cover-top .dots{display:none}
}
/* ADDED (TeleCRM): popup, submit state, invalid link page */
.pop-bg{position:fixed;inset:0;z-index:100;background:rgba(43,36,32,.45);display:grid;place-items:center;padding:16px}
.pop{background:#fff;border-radius:14px;max-width:400px;width:100%;padding:22px 20px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);border-top:5px solid var(--sage)}
.pop.err{border-top-color:var(--no)}
.pop .pi{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:var(--sage);font-size:24px;font-weight:700}
.pop.err .pi{background:var(--no)}
.pop h4{font-family:var(--serif);font-size:22px;margin:0 0 6px}
.pop p{margin:0 0 16px;color:#4a3f37;font-size:13.5px;line-height:1.5;white-space:pre-line}
.pop button{font:700 13px var(--sans);border-radius:8px;padding:10px 26px;border:0;background:var(--brown);color:#fff;cursor:pointer}
button.btn[disabled]{opacity:.65;cursor:wait}
.badlink{max-width:520px;margin:12vh auto;background:#fff;border-radius:14px;padding:28px 22px;text-align:center;box-shadow:0 2px 18px rgba(90,60,30,.12)}
.badlink h2{font-family:var(--serif);margin:0 0 8px}
.topbar .bno{font-size:11px;opacity:.9;letter-spacing:.04em}
.sent-note{background:#eef5f0;border:1px solid #cfe2d5;border-radius:9px;padding:9px 12px;font-size:12.5px;color:#35553f}
</style>

const C={T:"var(--terra)",S:"var(--sage)",B:"var(--blue)",M:"var(--mustard)",P:"var(--plum)",Br:"var(--brown)"};
const CYCLE=["T","S","B","M","P","Br"];
const ROOMCYCLE=["T","S","B","P","M","Br"];
const svg=n=>ICONS[n]||"";
const TICK='<svg viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let N=0;const nid=p=>p+(++N);
const ic=(i,c,cls="")=>`<span class="ic ${cls}" style="--c:${C[c]||c}">${svg(i)}</span>`;

function fields(cols,list){
  return `<div class="row" style="grid-template-columns:${cols}">${list.map(([l,t="text",cls=""])=>{const id=nid("t");
    return `<label class="fld ${cls}" for="${id}"><span>${esc(l)}</span><input id="${id}" name="${id}" type="${t}" data-label="${esc(l)}"${t==="number"?' inputmode="numeric" min="0"':""}></label>`}).join("")}</div>`;
}
function cards(q,items,opts={}){
  const g=nid("g");
  return `<div class="q">${esc(q)}</div><div class="cards" data-q="${esc(q)}" style="--n:${opts.n||items.length}">${items.map((it,k)=>{
    const [label,vis,col]=it;const id=`${g}_${k}`;
    let v;
    if(opts.kind==="mood")v=`<span class="sw">${vis.map(c=>`<i style="background:${c}"></i>`).join("")}</span>`;
    else if(opts.kind==="tile"&&typeof vis==="string"&&vis.startsWith("."))v=`<span class="tile ${vis.slice(1)}"></span>`;
    else if(opts.kind==="coins")v=`<span class="coins">${coins(vis)}</span>`;
    else if(opts.kind==="gems")v=`<span class="gems">${svg("gem").repeat(vis)}</span>`;
    else v=ic(vis,col||CYCLE[k%6]);
    return `<label class="opt ${opts.kind==="mood"?"mood":""} ${opts.tall?"tall":""}"><input type="checkbox" id="${id}" name="${g}" value="${esc(label)}"><span class="cb">${TICK}</span>${v}<span>${esc(label)}</span></label>`}).join("")}</div>`;
}
function coins(k){
  const stacks=[[3],[5],[8],[11],[7,13],[9,13,7]][k-1];let x=0,parts=[];
  const w=26,gap=4,total=stacks.length*w+(stacks.length-1)*gap;
  stacks.forEach(h=>{for(let j=0;j<h;j++){const y=44-j*3;parts.push(`<rect x="${x}" y="${y-3}" width="${w}" height="3" rx="1.5" fill="${j%2?"#c8953e":"#d4a24c"}"/>`)}
    parts.push(`<ellipse cx="${x+w/2}" cy="${44-h*3}" rx="${w/2}" ry="2" fill="#e8c06e"/>`);x+=w+gap});
  return `<svg viewBox="0 -2 ${total} 48" width="${total}" height="38" aria-hidden="true">${parts.join("")}</svg>`;
}
function pills(q,items){
  const g=nid("g");
  return `<div class="q">${esc(q)}</div><div class="pills" data-q="${esc(q)}">${items.map((l,k)=>{
    const id=`${g}_${k}`;
    if(l.endsWith(":")){const tid=nid("t");return `<label class="pill"><input type="checkbox" id="${id}" name="${g}" value="${esc(l.slice(0,-1))}"><span class="cb">${TICK}</span>${esc(l)}<input class="inl" type="text" id="${tid}" data-label="${esc(q+" – "+l.slice(0,-1))}" aria-label="${esc(l)}"></label>`}
    return `<label class="pill"><input type="checkbox" id="${id}" name="${g}" value="${esc(l)}"><span class="cb">${TICK}</span>${esc(l)}</label>`}).join("")}</div>`;
}
function lined(prompt,rows,icon="pencil",col="S"){
  const id=nid("a");
  return `<div class="lined"><label class="lh" for="${id}">${ic(icon,col)}${esc(prompt)}</label><textarea id="${id}" name="${id}" data-label="${esc(prompt)}" style="--r:${rows}" rows="${rows}"></textarea></div>`;
}
function sec(n,title,icon,hint=""){
  return `<div class="sec" id="step-${n}"><span class="num">${n}</span><h2>${esc(title)}</h2>${hint?`<span class="hint">${esc(hint)}</span>`:""}${ic(icon,"T")}</div>`;
}
function room(name,icon,k,items){
  const c=C[ROOMCYCLE[k%6]];const r=nid("r");
  return `<div class="room" data-room="${esc(name)}" style="--c:${c}"><div class="rhead"><span class="t">${ic(icon,c)}${esc(name)}</span>
   <span class="h" style="--d:#8fd0a6">YES</span><span class="h" style="--d:#f2c768">MAYBE</span><span class="h" style="--d:#f09a85">NO</span><span class="n">Size / material / notes</span></div>
   ${items.map((it,i)=>{const id=`${r}_${i}`;return `<div class="ritem" data-item="${esc(it)}"><span>${esc(it)}</span>${
     [["Yes","--yes"],["Maybe","--maybe"],["No","--no"]].map(([v,k])=>`<label class="tc" style="--k:var(${k})"><input type="checkbox" id="${id}_${v}" name="${id}" value="${v}" data-excl aria-label="${esc(name+" – "+it+": "+v)}"><span class="box">${TICK}</span></label>`).join("")
   }<input class="note" type="text" id="${id}_n" aria-label="${esc(it)} – size / material / notes" placeholder=" "></div>`}).join("")}</div>`;
}

 <div class="actions"><button type="button" class="btn pri" id="bSubmit">Submit brief</button><button type="submit" class="btn" id="bReview">Review my answers</button><button type="button" class="btn" id="bCopy">Copy answers</button><button type="button" class="btn" id="bClear">Clear form</button><span class="status" id="status">Your answers are saved as a draft on this device.</span></div>

const form=document.getElementById("brief");
form.innerHTML=html.join("");

/* exclusive Yes/Maybe/No */
form.addEventListener("change",e=>{const t=e.target;if(t.matches("[data-excl]")&&t.checked)form.querySelectorAll(`input[name="${t.name}"]`).forEach(o=>{if(o!==t)o.checked=false})});
/* tapping inside an inline "Other:" text should tick its pill */
form.querySelectorAll(".pill .inl").forEach(inp=>{inp.addEventListener("click",e=>e.preventDefault());inp.addEventListener("input",()=>{const cb=inp.parentElement.querySelector("input[type=checkbox]");if(inp.value&&!cb.checked){cb.checked=true;save()}})});
/* photos */
/* ORIGINAL (kept for reference):
form.querySelectorAll("[data-photo] input[type=file]").forEach(f=>f.addEventListener("change",()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const a=f.parentElement;let im=a.querySelector("img");if(!im){im=document.createElement("img");im.alt=a.dataset.photo+" inspiration photo";a.insertBefore(im,f)}im.src=rd.result};rd.readAsDataURL(file)}));
   UPDATED: the photo is made smaller (max 1400px, JPEG) so it sends fast on mobile data */
function shrink(dataUrl){return new Promise(res=>{const im=new Image();im.onload=()=>{const M=1400;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",0.82))};im.onerror=()=>res(null);im.src=dataUrl})}
form.querySelectorAll("[data-photo] input[type=file]").forEach(f=>f.addEventListener("change",()=>{const file=f.files[0];if(!file)return;
  if(!/^image\//.test(file.type||"image/")){popup("err","Not a photo","Please choose a photo (JPG or PNG).");f.value="";return}
  const rd=new FileReader();
  rd.onload=async()=>{const small=await shrink(rd.result);if(!small){popup("err","Photo not added","This photo could not be opened. Please choose another photo.");f.value="";return}
    const a=f.parentElement;let im=a.querySelector("img");if(!im){im=document.createElement("img");im.alt=a.dataset.photo+" inspiration photo";a.insertBefore(im,f)}im.src=small;im.dataset.fresh="1"};rd.readAsDataURL(file)}));

/* draft */
/* ADDED (TeleCRM): each link has its own token -> its own draft on this device */
const TOKEN=(location.pathname.match(/\/brief\/([a-f0-9]+)/i)||[])[1]||new URLSearchParams(location.search).get("t")||"";
const API="/api/public/briefs/"+TOKEN;
/* ORIGINAL: const KEY="di-client-brief-native-v1"; */
const KEY="di-client-brief-native-v1-"+TOKEN;
function save(){const d={};form.querySelectorAll("input,textarea").forEach(el=>{if(!el.id||el.type==="file"||el.id==="summary")return;if(el.type==="checkbox"){if(el.checked)d[el.id]=1}else if(el.value)d[el.id]=el.value});
  try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}progress()}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}if(!d)return;
  Object.entries(d).forEach(([id,v])=>{const el=document.getElementById(id);if(!el)return;if(el.type==="checkbox")el.checked=true;else el.value=v})}
function progress(){for(let k=1;k<=STEPS.length;k++){const s=document.getElementById("step-"+k);let el=s.nextElementSibling,on=false;
  while(el&&!el.classList.contains("sec")){if([...el.querySelectorAll("input,textarea")].some(i=>i.type==="checkbox"?i.checked:(i.type!=="file"&&i.id!=="summary"&&i.value))){on=true;break}el=el.nextElementSibling}
  document.getElementById("j"+(k-1)).classList.toggle("done",on)}}
load();progress();
form.addEventListener("input",save);form.addEventListener("change",save);

/* summary */
function summary(){
  const out=["INTERIOR DESIGN CLIENT BRIEF"];let cur=null;
  [...form.children].forEach(el=>{
    if(el.classList.contains("sec")){cur=el.querySelector(".num").textContent+". "+el.querySelector("h2").textContent.toUpperCase();return}
    const lines=[];const q=s=>[...(el.matches(s)?[el]:[]),...el.querySelectorAll(s)];
    q(".fld input").forEach(i=>{if(i.value)lines.push(`${i.dataset.label}: ${i.value}`)});
    q("[data-q]").forEach(g=>{const v=[...g.querySelectorAll("input[type=checkbox]:checked")].map(c=>{const t=c.parentElement.querySelector(".inl");return t&&t.value?`${c.value} (${t.value})`:c.value});if(v.length)lines.push(`${g.dataset.q}: ${v.join(", ")}`)});
    q("textarea[data-label]").forEach(t=>{if(t.value)lines.push(`${t.dataset.label} ${t.value.replace(/\n+/g," / ")}`)});
    q(".room").forEach(r=>{const rows=[];r.querySelectorAll(".ritem").forEach(it=>{const c=it.querySelector("input:checked");const n=it.querySelector(".note").value;if(c||n)rows.push(`   - ${it.dataset.item}: ${c?c.value:"—"}${n?" ("+n+")":""}`)});if(rows.length)lines.push(r.dataset.room+":",...rows)});
    q("#confirm").forEach(c=>{if(c.checked)lines.push("Client confirmed the information: Yes")});
    const ph=q("[data-photo] img").map(i=>i.parentElement.dataset.photo);if(ph.length)lines.push("Photos added: "+ph.join(", "));
    if(lines.length){if(cur){out.push("",cur);cur=null}out.push(...lines)}
  });
  return out.join("\n");
}
const status=document.getElementById("status");
const say=t=>{status.textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>status.textContent="Your answers are saved as a draft on this device.",2600)};
const showSum=()=>{const s=document.getElementById("summary");s.value=summary();s.hidden=false;return s};
form.addEventListener("submit",e=>{e.preventDefault();showSum().scrollIntoView({block:"center"})});
document.getElementById("bCopy").addEventListener("click",()=>{const s=showSum();navigator.clipboard.writeText(s.value).then(()=>say("Answers copied. Paste them into WhatsApp or email.")).catch(()=>{s.focus();s.select();say("Press Ctrl+C (or Copy) to copy the selected answers.")})});
let armed=false;
document.getElementById("bClear").addEventListener("click",e=>{const b=e.currentTarget;
  if(!armed){armed=true;b.textContent="Tap again to clear everything";setTimeout(()=>{armed=false;b.textContent="Clear form"},3500);return}
  armed=false;b.textContent="Clear form";form.reset();form.querySelectorAll("[data-photo] img").forEach(i=>i.remove());form.querySelectorAll("[data-photo] input[type=file]").forEach(f=>{f.value=""});
  try{localStorage.removeItem(KEY)}catch(e){}document.getElementById("summary").hidden=true;progress();say("Form cleared.")});

/* ===== ADDED (TeleCRM): send the brief to Deeraj Interiors ===== */
function popup(type,title,text,after){
  const bg=document.createElement("div");bg.className="pop-bg";
  bg.innerHTML=`<div class="pop ${type==="err"?"err":""}" role="dialog" aria-modal="true"><div class="pi">${type==="err"?"!":"&#10003;"}</div><h4></h4><p></p><button type="button">OK</button></div>`;
  bg.querySelector("h4").textContent=title;bg.querySelector("p").textContent=text;
  const close=()=>{bg.remove();if(after)after()};
  bg.querySelector("button").addEventListener("click",close);bg.addEventListener("click",e=>{if(e.target===bg)close()});
  document.body.appendChild(bg);bg.querySelector("button").focus();
}
const byLabel=l=>[...form.querySelectorAll("[data-label]")].find(i=>i.dataset.label===l);
const val=l=>{const i=byLabel(l);return i?i.value.trim():""};
const picked=q=>{const g=[...form.querySelectorAll("[data-q]")].filter(x=>x.dataset.q===q);return g.flatMap(x=>[...x.querySelectorAll("input[type=checkbox]:checked")].map(c=>{const t=c.parentElement.querySelector(".inl");return t&&t.value?`${c.value} (${t.value})`:c.value})).join(", ")};
function setIfEmpty(l,v){const i=byLabel(l);if(i&&!i.value&&v){i.value=v}}
let serverPhotos=[];
/* the same answers as the summary, grouped by section (shown in TeleCRM) */
function structured(){
  const out=[];let cur={section:"Brief details",items:[]};
  const push=(q,a)=>{if(a!==""&&a!=null)cur.items.push({q,a:String(a)})};
  [...form.children].forEach(el=>{
    if(el.classList.contains("sec")){if(cur.items.length)out.push(cur);cur={section:el.querySelector(".num").textContent+". "+el.querySelector("h2").textContent,items:[]};return}
    const q=s=>[...(el.matches(s)?[el]:[]),...el.querySelectorAll(s)];
    q(".fld input").forEach(i=>push(i.dataset.label,i.value.trim()));
    q("[data-q]").forEach(g=>{const v=[...g.querySelectorAll("input[type=checkbox]:checked")].map(c=>{const t=c.parentElement.querySelector(".inl");return t&&t.value?`${c.value} (${t.value})`:c.value});if(v.length)push(g.dataset.q,v.join(", "))});
    q("textarea[data-label]").forEach(t=>push(t.dataset.label.replace(/:$/,""),t.value.trim()));
    q(".room").forEach(r=>r.querySelectorAll(".ritem").forEach(it=>{const c=it.querySelector("input:checked");const n=it.querySelector(".note").value.trim();if(c||n)push(`${r.dataset.room} – ${it.dataset.item}`,`${c?c.value:"—"}${n?" ("+n+")":""}`)}));
    q("#confirm").forEach(c=>{if(c.checked)push("Client confirmed the information","Yes")});
    const ph=q("[data-photo] img").map(i=>i.parentElement.dataset.photo);if(ph.length)push("Photos added",ph.join(", "));
  });
  if(cur.items.length)out.push(cur);return out;
}
function rawState(){const d={};form.querySelectorAll("input,textarea").forEach(el=>{if(!el.id||el.type==="file"||el.id==="summary")return;if(el.type==="checkbox"){if(el.checked)d[el.id]=1}else if(el.value)d[el.id]=el.value});return d}
function applyRaw(d){form.reset();Object.entries(d||{}).forEach(([id,v])=>{const el=document.getElementById(id);if(!el)return;if(el.type==="checkbox")el.checked=true;else el.value=v})}
function showPhotos(slots){serverPhotos=slots||[];serverPhotos.forEach(slot=>{const a=form.querySelector(`[data-photo="${slot}"]`);if(!a||a.querySelector("img"))return;
  const im=document.createElement("img");im.alt=slot+" inspiration photo";im.src=API+"/photos/"+encodeURIComponent(slot)+"?v="+Date.now();a.insertBefore(im,a.querySelector("input[type=file]"))})}
function badLink(msg){document.querySelector(".outer").innerHTML=`<div class="badlink"><h2>Link not valid</h2><p></p></div>`;document.querySelector(".badlink p").textContent=msg}
const sb=document.getElementById("bSubmit");
function markSent(again){sb.textContent="Update my brief";
  let n=document.getElementById("sentNote");if(!n){n=document.createElement("div");n.id="sentNote";n.className="sent-note";form.querySelector(".actions").before(n)}
  n.textContent=again?"Your brief was sent to Deeraj Interiors. You can change anything and tap “Update my brief”.":"Your brief was sent to Deeraj Interiors. You can change anything and tap “Update my brief”."}
async function init(){
  if(!TOKEN){badLink("This link is not complete. Please open the full link sent by Deeraj Interiors on WhatsApp.");return}
  let d;try{const r=await fetch(API);d=await r.json();if(!r.ok){badLink(d.error||"This link is not valid.");return}}catch(e){say("Could not reach Deeraj Interiors - check your internet.");return}
  document.getElementById("bno").textContent=d.brief_no;
  let hasDraft=false;try{hasDraft=!!localStorage.getItem(KEY)}catch(e){}
  if(!hasDraft&&d.raw)applyRaw(d.raw);
  setIfEmpty("Designer / Studio","Deeraj Interiors");setIfEmpty("Brief no.",d.brief_no);
  const today=new Date();const iso=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const firstDate=[...form.querySelectorAll('.fld input[type=date]')].find(i=>i.dataset.label==="Date");if(firstDate&&!firstDate.value)firstDate.value=iso;
  setIfEmpty("Full name",d.client_name);setIfEmpty("Phone / WhatsApp",d.phone);
  showPhotos(d.photos);if(d.submitted)markSent(true);progress();
}
sb.addEventListener("click",async()=>{
  if(!val("Full name")){popup("err","Your name is missing","Please write your full name in Section 1 (About You).",()=>byLabel("Full name").focus());return}
  if(val("Phone / WhatsApp").replace(/\D/g,"").length<10){popup("err","Phone number is missing","Please write your 10-digit phone / WhatsApp number in Section 1 (About You).",()=>byLabel("Phone / WhatsApp").focus());return}
  if(!document.getElementById("confirm").checked){popup("err","Please confirm","Please tick “I confirm the information above is correct” in Section 8 (Final Notes) before sending.",()=>document.getElementById("confirm").closest("label").scrollIntoView({block:"center"}));return}
  const photos={};["Living","Kitchen","Bedroom"].forEach(slot=>{const a=form.querySelector(`[data-photo="${slot}"]`);const im=a&&a.querySelector("img");
    if(im&&im.dataset.fresh&&im.src.startsWith("data:"))photos[slot]=im.src;else if(!im&&serverPhotos.includes(slot))photos[slot]=null});
  const body={raw:rawState(),answers:structured(),summary:summary(),photos,
    key:{name:val("Full name"),phone:val("Phone / WhatsApp"),email:val("Email"),city_area:val("City & area / landmark"),property_type:picked("Property type"),configuration:picked("Configuration"),
         budget:[picked("Rough budget (Rs.)"),val("Exact budget, if fixed (Rs.)")?"Rs. "+val("Exact budget, if fixed (Rs.)"):""].filter(Boolean).join(" / ")}};
  const label=sb.textContent;sb.disabled=true;sb.textContent="Sending...";
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let d={};try{d=await r.json()}catch(e){}
    if(!r.ok){popup("err","Brief not sent",r.status===413?"The photos are too big to send. Please remove a photo and try again.":(d.error||"Please try again."));sb.textContent=label;return}
    form.querySelectorAll("[data-photo] img").forEach(i=>delete i.dataset.fresh);
    serverPhotos=["Living","Kitchen","Bedroom"].filter(s=>form.querySelector(`[data-photo="${s}"] img`));
    try{localStorage.removeItem(KEY)}catch(e){}
    markSent(d.again);
    popup("ok",d.again?"Brief updated":"Thank you!",d.again?"Your changes have been sent to Deeraj Interiors.":"Your brief has been sent to Deeraj Interiors. Our team will call you after reading it.");
  }catch(e){popup("err","Brief not sent","Could not reach Deeraj Interiors. Please check your internet and try again.");sb.textContent=label}
  finally{sb.disabled=false}
});
init();
</script>
